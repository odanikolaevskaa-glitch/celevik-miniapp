<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Целевик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0a0b0d; --panel:#14161d; --panel2:#1b1f28; --line:#2a2f3b;
      --ink:#f1f2f5; --muted:#8b90a0; --gold:#e3b23c;
      --long:#e3b23c; --long-soft:#3a3320; --medium:#c6ccd6; --medium-soft:#2c313c; --short:#cd9052; --short-soft:#33291d;
      --house:#6f9bc0; --house-soft:#22313e;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
    body{min-height:100vh;padding:0 15px calc(40px + env(safe-area-inset-bottom));}
    .wrap{max-width:520px;margin:0 auto;}

    header{padding:22px 2px 14px;}
    .brand{text-align:center;padding:26px 2px 18px;}
    .logo{width:140px;height:140px;border-radius:50%;object-fit:cover;display:inline-block;
      box-shadow:0 10px 34px rgba(227,178,60,.20), 0 0 0 1px rgba(227,178,60,.30);}
    .brand-name{margin-top:13px;font-size:19px;font-weight:600;letter-spacing:.36em;padding-left:.36em;
      background:linear-gradient(90deg,#bd8a2e,#f6d370 45%,#e3b23c);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .brand .subtitle{margin-top:7px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
    .title{font-size:24px;font-weight:800;letter-spacing:-.01em;}
    .subtitle{margin-top:5px;color:var(--muted);font-size:13.5px;font-weight:500;}

    /* ---------- Панель недели ---------- */
    .week{background:linear-gradient(160deg,#1b1f2a,#15181f);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
    .week-top{display:flex;align-items:center;gap:16px;}
    .prize-badge{width:72px;height:96px;flex:0 0 72px;}
    .prize-badge svg{width:100%;height:100%;display:block;}
    .week-info{flex:1;min-width:0;}
    .wp-num{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;}
    .wp-num span{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0;}
    .prize-name{margin-top:6px;font-size:15px;font-weight:700;color:var(--gold);}
    .week-days{margin-top:3px;font-size:12.5px;color:var(--muted);font-weight:500;}
    .bar{margin-top:14px;height:9px;border-radius:6px;background:#0e1016;border:1px solid var(--line);overflow:hidden;}
    .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#b8862c,#f6d370);transition:width .5s ease;}
    .bar-label{margin-top:7px;font-size:12.5px;color:var(--muted);font-weight:500;}
    .wp-break{margin-top:12px;display:flex;gap:8px;}
    .wp-break div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;}
    .wp-break b{display:block;font-size:16px;font-weight:800;}
    .wp-break small{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}

    /* ---------- Награда (оверлей) ---------- */
    .reward{background:linear-gradient(160deg,#221d10,#15140e);border:1px solid #4a3d1c;border-radius:16px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;animation:pop .5s cubic-bezier(.34,1.5,.6,1);}
    .reward .prize-badge{width:56px;height:76px;flex:0 0 56px;}
    .reward-txt{flex:1;}
    .reward-txt .r1{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
    .reward-txt .r2{font-size:18px;font-weight:800;margin-top:2px;}
    .reward-txt .r3{font-size:12.5px;color:var(--muted);margin-top:2px;}
    .reward .close{background:#2a2f3b;border:none;color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;}
    .r-praise{margin-top:9px;font-size:13.5px;line-height:1.45;color:#e8dfc8;font-weight:500;}
    .expenses{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;}
    .expenses h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;}
    .exp-total{font-size:20px;font-weight:800;margin-bottom:10px;}
    .exp-total b{color:var(--gold);}
    .exp-metrics{display:flex;gap:10px;margin-bottom:12px;}
    .exp-metrics>div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
    .exp-metrics small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
    .exp-metrics b{font-size:18px;font-weight:800;}
    .exp-metrics .month b{color:var(--gold);}
    .exp-cat-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 4px;}
    .cat-block{border-top:1px solid var(--line);}
    .cat-head{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;user-select:none;}
    .cat-head .cchev{color:var(--muted);font-size:11px;transition:transform .2s;flex:0 0 auto;}
    .cat-head .cchev.open{transform:rotate(90deg);}
    .cat-head .cn{flex:1;font-size:14px;font-weight:600;}
    .cat-head .cs{font-weight:800;font-size:14px;}
    .cat-body{padding:0 2px 6px;}
    .exp-row2{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #20242e;}
    .exp-row2 .d{font-weight:700;color:#9aa0ad;font-size:12.5px;flex:0 0 auto;}
    .exp-row2 .it{flex:1;min-width:0;color:var(--ink);font-weight:500;font-size:13.5px;}
    .exp-row2 .am{font-weight:700;font-size:13.5px;}
    .exp-row2 .del{flex:0 0 auto;border:1px solid #5a2a24;border-radius:6px;background:#3a1e1a;color:#e05a4a;font-weight:800;font-size:12px;padding:4px 8px;cursor:pointer;}
    .exp-cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
    .exp-chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);}
    .exp-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
    .exp-form input{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#0e1016;color:var(--ink);font-size:14px;font-family:inherit;font-weight:500;outline:none;min-width:0;}
    .exp-form .e-date{flex:0 0 auto;color-scheme:dark;max-width:128px;}
    .exp-form .e-item{flex:1 1 100%;}
    .exp-form .e-amt{flex:1 1 90px;}
    .exp-form .e-cat{flex:1 1 110px;}
    .exp-form input:focus{border-color:var(--gold);}
    .e-add{flex:1 1 100%;border:none;border-radius:9px;background:var(--gold);color:#1a1400;font-weight:800;font-size:14px;padding:11px;cursor:pointer;}
    .exp-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);}
    .exp-main{flex:1;min-width:0;font-size:14px;font-weight:500;}
    .exp-date{color:var(--muted);font-weight:700;font-size:12.5px;margin-right:6px;}
    .exp-cat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:#22313e;color:#6f9bc0;white-space:nowrap;}
    .exp-amt{flex:0 0 auto;font-weight:800;font-size:14.5px;}
    .exp-del{flex:0 0 auto;border:1px solid #5a2a24;border-radius:7px;background:#3a1e1a;color:#e05a4a;font-weight:800;font-size:13px;padding:6px 9px;cursor:pointer;}
    @keyframes pop{0%{transform:scale(.9);opacity:0;}100%{transform:scale(1);opacity:1;}}

    /* ---------- Секции ---------- */
    .section{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
    .sec-head{display:flex;align-items:center;gap:11px;padding:15px 16px;cursor:pointer;user-select:none;}
    .sec-head .tag{width:9px;height:9px;border-radius:2px;flex:0 0 9px;}
    .s-long .tag{background:var(--long);} .s-medium .tag{background:var(--medium);} .s-short .tag{background:var(--short);} .s-house .tag{background:var(--house);}
    .sec-name{font-size:16px;font-weight:700;flex:1;min-width:0;}
    .weight-chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;}
    .s-long .weight-chip{background:var(--long-soft);color:var(--long);} .s-medium .weight-chip{background:var(--medium-soft);color:var(--medium);} .s-short .weight-chip{background:var(--short-soft);color:var(--short);} .s-house .weight-chip{background:var(--house-soft);color:var(--house);}
    .chev{color:var(--muted);font-size:13px;transition:transform .2s;flex:0 0 auto;}
    .chev.open{transform:rotate(90deg);}
    .urg{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
    .urg.soon{background:#e0a53c;box-shadow:0 0 6px rgba(224,165,60,.6);}
    .urg.over{background:#e05a4a;box-shadow:0 0 7px rgba(224,90,74,.7);}
    .due{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:8px;white-space:nowrap;}
    .due.later{background:#242a36;color:var(--muted);}
    .due.soon{background:#3a2f16;color:#e0a53c;}
    .due.over{background:#3a1e1a;color:#e05a4a;}
    .due-btn{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap;}
    .due-btn.add-due-btn{color:#7f8496;}
    .due-btn.later{color:#c6ccd6;}
    .due-btn.soon{background:#3a2f16;color:#e0a53c;border-color:#5a4820;}
    .due-btn.over{background:#3a1e1a;color:#e05a4a;border-color:#5a2a24;}
    .due-edit{position:absolute;right:8px;bottom:4px;width:1px;height:1px;opacity:0;pointer-events:none;}
    .due-lbl{align-self:center;font-size:12px;color:var(--muted);font-weight:600;}
    .edit-in{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--gold);background:#0e1016;color:var(--ink);font-size:14.5px;font-family:inherit;font-weight:500;outline:none;}
    .edit-ok{flex:0 0 auto;border:none;border-radius:8px;background:var(--gold);color:#1a1400;font-weight:800;font-size:13px;padding:9px 13px;cursor:pointer;}
    .edit-del{flex:0 0 auto;border:1px solid #5a2a24;border-radius:8px;background:#3a1e1a;color:#e05a4a;font-weight:800;font-size:14px;padding:9px 12px;cursor:pointer;}
    .plan-bar{margin-top:10px;height:6px;border-radius:5px;background:#0e1016;border:1px solid var(--line);overflow:hidden;}
    .plan-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#4d6f89,#6f9bc0);transition:width .5s ease;}
    .add-form input.add-text{flex:1 1 100%;}
    .add-form input[type=date]{flex:0 0 auto;color-scheme:dark;max-width:128px;}
    .sec-sub{padding:0 16px 6px;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:-6px;}
    .sec-body{padding:0 16px 6px;}

    .task{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);animation:tin .2s ease;position:relative;}
    @keyframes tin{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
    .check{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:2px solid #3a4150;background:transparent;cursor:pointer;transition:transform .12s,border-color .12s;}
    .check:active{transform:scale(.85);}
    .s-long .check:hover{border-color:var(--long);} .s-medium .check:hover{border-color:var(--medium);} .s-short .check:hover{border-color:var(--short);} .s-house .check:hover{border-color:var(--house);}
    .task-text{flex:1;font-size:14.5px;font-weight:500;line-height:1.35;}
    .task.done{animation:tout .38s ease forwards;}
    @keyframes tout{to{opacity:0;transform:translateX(36px);height:0;padding:0;margin:0;}}
    .empty{border-top:1px solid var(--line);padding:14px 2px;color:var(--muted);font-size:13.5px;font-weight:500;}

    .add-row{padding:8px 0 12px;}
    .add-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer;background:var(--panel2);color:var(--ink);}
    .add-btn:active{transform:scale(.96);}
    .add-form{display:none;gap:8px;flex-wrap:wrap;padding:2px 0 12px;}
    .add-form.open{display:flex;}
    .add-form input{flex:1;min-width:0;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#0e1016;font-size:15px;font-family:inherit;font-weight:500;color:var(--ink);outline:none;}
    .add-form input:focus{border-color:var(--gold);}
    .save-btn{flex:0 0 auto;padding:0 18px;border-radius:9px;border:none;background:var(--gold);color:#1a1400;font-size:15px;font-weight:800;cursor:pointer;}

    /* ---------- Полка трофеев ---------- */
    .shelf{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:4px;}
    .shelf h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;}
    .shelf-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
    .trophy{flex:0 0 auto;width:74px;text-align:center;}
    .trophy .prize-badge{width:52px;height:70px;margin:0 auto;}
    .trophy .tl{font-size:11px;font-weight:700;margin-top:4px;}
    .trophy .tp{font-size:10.5px;color:var(--muted);}
    .shelf-empty{color:var(--muted);font-size:13.5px;font-weight:500;}

    #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#242a36;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;gap:9px;max-width:88%;border:1px solid var(--line);transition:opacity .25s,transform .25s;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    #toast .tdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}

    .stub{max-width:420px;margin:60px auto 0;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 24px;}
    .stub h2{font-size:19px;font-weight:800;margin-bottom:10px;}
    .stub p{color:var(--muted);font-size:15px;line-height:1.5;}

  
  .exp-row2 .mv{flex:0 0 auto;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--gold);font-weight:800;font-size:13px;padding:3px 8px;cursor:pointer;}
  .exp-row2 .mv-sel{flex:0 1 150px;min-width:0;padding:8px 8px;border-radius:8px;border:1px solid var(--gold);background:#0e1016;color:var(--ink);font-size:14px;font-family:inherit;font-weight:600;outline:none;color-scheme:dark;}
  .exp-row2 .mv-ok{flex:0 0 auto;border:none;border-radius:8px;background:var(--gold);color:#1a1400;font-weight:800;font-size:13px;padding:9px 13px;cursor:pointer;}
  /* ---------- План недели ---------- */
  .plan-line{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-weight:500;}
  .plan-reset{border:none;background:none;color:#7f8496;font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 0;font-family:inherit;}
  .plan-box{margin-top:14px;display:flex;align-items:center;gap:12px;background:#13212b;border:1px solid #2f4a5e;border-radius:12px;padding:12px;}
  .pb-txt{flex:1;min-width:0;}
  .pb-txt b{display:block;font-size:13.5px;font-weight:800;color:#6f9bc0;}
  .pb-txt span{display:block;margin-top:3px;font-size:12px;line-height:1.4;color:var(--muted);font-weight:500;}
  .plan-set{flex:0 0 auto;border:none;border-radius:9px;background:#6f9bc0;color:#0d1117;font-weight:800;font-size:13px;padding:10px 12px;cursor:pointer;font-family:inherit;}
  .trophy{width:84px;}
  .trophy .tl{font-size:10.5px;line-height:1.2;}
  /* ---------- Праздник ---------- */
  #fx{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 36%,rgba(64,50,16,.97),rgba(8,9,12,.98) 72%);animation:fxin .3s ease;}
  #fx canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .fx-card{position:relative;text-align:center;max-width:340px;}
  .fx-prize{width:186px;height:248px;margin:0 auto;animation:fxpop .75s cubic-bezier(.34,1.5,.6,1);filter:drop-shadow(0 14px 38px rgba(227,178,60,.38));}
  .fx-prize svg{width:100%;height:100%;display:block;}
  .fx-k{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
  .fx-t{margin-top:6px;font-size:27px;font-weight:800;line-height:1.15;
    background:linear-gradient(90deg,#bd8a2e,#f6d370 45%,#e3b23c);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .fx-s{margin-top:12px;font-size:16px;line-height:1.5;color:#efe6cf;font-weight:500;}
  .fx-btn{margin-top:22px;border:none;border-radius:12px;background:var(--gold);color:#1a1400;font-weight:800;font-size:16px;padding:14px 40px;cursor:pointer;font-family:inherit;}
  @keyframes fxin{from{opacity:0;}to{opacity:1;}}
  @keyframes fxpop{0%{transform:scale(.3) rotate(-8deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;}}
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

      json.sections.forEach(sec=>{ s[sec.id]={tasks:(sec.tasks||[]).map(t=>({id:t.id,text:t.text}))}; });
      return {version:1, order:json.sections.map(x=>x.id), sections:s,
        week:{key:weekKey(new Date()),points:0,by:{long:0,medium:0,short:0,household:0}},
        trophies:[], collapsed:{long:false,medium:false,short:false,household:false}, expenses:[]};
    }

    function weekKey(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day);
      return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
    function daysLeft(){ const day=(new Date().getDay()+6)%7; return 7-day; }
    function prizeLevel(pts){ let lv=0; for(let i=0;i<THRESH.length;i++){ if(pts>=THRESH[i]) lv=i+1; } return lv; }

    function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
    function speech(lv){
      if(lv>=9) return pick([
        `${NAME}, ты легенда! План разнесён в щепки. Аплодирую стоя!`,
        `${NAME}, это высшая награда, и она твоя. Ты невероятная, горжусь тобой безмерно!`,
        `${NAME}, ты супер! Такой недели ещё не было. Ты сделала это!`]);
      if(lv>=5) return pick([
        `${NAME}, ты просто огонь! Такую неделю не каждый вытянет, а ты смогла. Горжусь тобой!`,
        `${NAME}, ты сделала это! Кубок твой по праву: заслужен каждым закрытым делом.`,
        `${NAME}, браво! Ты не сдалась на середине и дошла. Очень тобой горжусь!`]);
      if(lv>=2) return pick([
        `${NAME}, ты супер! Ты сделала это! Молодец, горжусь тобой!`,
        `${NAME}, вот это темп! Обещала себе и сделала. Умница!`,
        `${NAME}, ты большая молодец! Шаг за шагом, так и строится большое.`]);
      return pick([
        `${NAME}, начало положено! Первый шаг сделан, горжусь тобой.`,
        `${NAME}, ты молодец! Маленькая победа тоже победа. Дальше будет больше!`]);
    }
    function planSpeech(){ return pick([
      `${NAME}, план недели закрыт! Сказала и сделала. Горжусь тобой!`,
      `${NAME}, ты супер! План выполнен полностью. Ты сделала это!`,
      `${NAME}, вот это дисциплина! План недели твой. Молодец!`]); }
    function praise(t){
      let s=speech(t.level);
      if(t.planHit){ s+=" "+(t.plan && t.points>t.plan*1.15
        ? "План недели перевыполнен: ты превзошла саму себя."
        : "И план недели закрыт полностью, отдельный респект."); }
      return s;
    }
    function dueState(t){ if(!t.due) return "none"; const now=Date.now(); if(t.due<now) return "over"; if(t.due-now<=SOON_MS) return "soon"; return "later"; }
    function fmtDue(due){ const d=new Date(due); return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2); }
    // План считается от краткосрочных целей недели (открытые + уже закрытые на этой неделе) плюс 5 очков сверху.
    // После фиксации state.week.plan больше не пересчитывается.
    function shortCount(){ return state.sections.short.tasks.length + ((state.week&&state.week.by&&state.week.by.short)||0); }
    function potentialPoints(){ return shortCount() * WEIGHT.short; }
    function suggestedPlan(){ const pot=potentialPoints(); return pot + PLAN_BONUS; }
    function plural(n,f){ const a=n%10,b=n%100; return (a===1&&b!==11)?f[0]:(a>=2&&a<=4&&(b<10||b>=20))?f[1]:f[2]; }
    function ask(msg,cb){
      try{ if(tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")){ tg.showConfirm(msg,ok=>{ if(ok) cb(); }); return; } }catch(e){}
      if(window.confirm(msg)) cb();
    }
    function applyPenalties(){
      let hit=0, lost=0;
      state.order.forEach(id=>{ state.sections[id].tasks.forEach(t=>{
        if(t.due && t.due<Date.now() && !t.penalized){ t.penalized=true; hit++; lost+=PENALTY; } }); });
      if(hit>0){ state.week.points=Math.max(0, state.week.points-lost); save(); return {hit,lost}; }
      return null;
    }

    function ensureWeek(){
      const cur=weekKey(new Date());
      if(!state.week){ state.week={key:cur,points:0,by:{long:0,medium:0,short:0,household:0}}; return; }
      if(state.week.key!==cur){
        if(state.week.points>0){
          const planV=state.week.plan||0;
          const planHit = planV>0 && state.week.points>=planV;
          const t={key:state.week.key,points:state.week.points,level:prizeLevel(state.week.points),plan:planV,planHit:planHit};
          state.trophies=state.trophies||[]; state.trophies.unshift(t); state.trophies=state.trophies.slice(0,24);
          justAwarded=Object.assign({}, t, {praiseText:praise(t)});
        }
        state.week={key:cur,points:0,by:{long:0,medium:0,short:0,household:0}};
        save();
      }
    }

    // ---------- Награды: статуэтки (SVG) ----------
    const METALS={ wood:['#d9b384','#8a6a42'], bronze:['#e8ac6e','#9a5f2e'], silver:['#f2f4f8','#9aa2b0'],
      gold:['#f9dc82','#b8842a'], platinum:['#f7f9fc','#b9c1ce'], crystal:['#e2f5fd','#7fbcd8'] };
    let uidc=0;
    function star(cx,cy,r){ let p=""; for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5, a2=a+Math.PI/5;
      p+=(i?"L":"M")+(cx+Math.cos(a)*r).toFixed(1)+" "+(cy+Math.sin(a)*r).toFixed(1)+" L"+(cx+Math.cos(a2)*r*0.45).toFixed(1)+" "+(cy+Math.sin(a2)*r*0.45).toFixed(1)+" "; } return p+"Z"; }
    function spark(x,y,r){ const q=r*0.24; return `<path d="M${x} ${y-r} L${x+q} ${y-q} L${x+r} ${y} L${x+q} ${y+q} L${x} ${y+r} L${x-q} ${y+q} L${x-r} ${y} L${x-q} ${y-q} Z" fill="#fff" opacity=".9"/>`; }
    function grad(id,m){ const[l,d]=METALS[m]; return `<radialGradient id="${id}" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="${l}"/><stop offset="1" stop-color="${d}"/></radialGradient>`; }
    function stem(uid,d,top,w){ w=w||2.2; return `<path d="M30.5 75 L${36-w} ${top} H${36+w} L41.5 75 Z" fill="url(#${uid})" stroke="${d}" stroke-width=".8"/>`; }
    function pedestal(uid,word){
      return `<defs>
        <linearGradient id="${uid}p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#434957"/><stop offset="1" stop-color="#1a1d25"/></linearGradient>
        <linearGradient id="${uid}q" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8842a"/><stop offset=".5" stop-color="#f9dc82"/><stop offset="1" stop-color="#b8842a"/></linearGradient></defs>
        <path d="M17 74 H55 L59 87 H13 Z" fill="url(#${uid}p)" stroke="#565d6e" stroke-width=".8"/>
        <rect x="9" y="87" width="54" height="6.5" rx="1.6" fill="url(#${uid}p)" stroke="#565d6e" stroke-width=".8"/>
        <rect x="17.5" y="76.8" width="37" height="7.8" rx="1.2" fill="url(#${uid}q)"/>
        <text x="36" y="82.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="${word.length>8?4.1:4.7}" font-weight="800" letter-spacing=".3" fill="#2a1f05">${word}</text>`; }
    function figStar(m,uid){ const[,d]=METALS[m];
      return `<defs>${grad(uid,m)}</defs>${stem(uid,d,46)}
        <path d="${star(36,35,26)}" fill="url(#${uid})" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="${star(36,35,11)}" fill="rgba(255,255,255,.42)"/>`; }
    function figFlame(m,uid){ const[,d]=METALS[m];
      return `<defs>${grad(uid,m)}</defs>${stem(uid,d,60)}
        <path d="M36 6 C46 20 55 30 53 45 C52 57 45 65 36 65 C27 65 20 57 19 45 C18 35 25 30 27 19 C30 26 33 27 34 23 C35 17 35 12 36 6 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M36 33 C41 41 45 46 44 53 C43 59 40 62 36 62 C32 62 29 59 28 53 C27 46 32 41 36 33 Z" fill="rgba(255,255,255,.4)"/>`; }
    function figBolt(m,uid){ const[,d]=METALS[m];
      return `<defs>${grad(uid,m)}</defs>${stem(uid,d,58)}
        <circle cx="36" cy="35" r="25" fill="rgba(255,255,255,.05)" stroke="url(#${uid})" stroke-width="4"/>
        <circle cx="36" cy="35" r="27.2" fill="none" stroke="${d}" stroke-width=".8"/>
        <path d="M43 13 L23 38 H34 L29 58 L50 31 H38 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.2" stroke-linejoin="round"/>`; }
    function figCrown(m,uid){ const[l,d]=METALS[m];
      return `<defs>${grad(uid,m)}</defs>${stem(uid,d,64,6)}
        <path d="M17 55 L12 23 L25 38 L36 13 L47 38 L60 23 L55 55 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/>
        <rect x="15" y="55" width="42" height="9" rx="2.5" fill="url(#${uid})" stroke="${d}" stroke-width="1.2"/>
        <circle cx="12" cy="22" r="3.4" fill="${l}" stroke="${d}"/><circle cx="36" cy="12" r="3.8" fill="${l}" stroke="${d}"/><circle cx="60" cy="22" r="3.4" fill="${l}" stroke="${d}"/>
        <circle cx="36" cy="59.5" r="2.6" fill="#e3b23c"/><circle cx="25" cy="59.5" r="1.8" fill="#6f9bc0"/><circle cx="47" cy="59.5" r="1.8" fill="#6f9bc0"/>
        ${spark(36,40,6)}`; }
    function figGem(m,uid){ const[,d]=METALS[m];
      return `<defs>${grad(uid,m)}</defs>${stem(uid,d,61,3)}
        <path d="M22 18 H50 L61 33 L36 67 L11 33 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M11 33 H61 M22 18 L29 33 L36 18 L43 33 L50 18 M29 33 L36 67 L43 33" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".9" stroke-linejoin="round"/>
        <path d="M22 18 L29 33 H11 Z" fill="rgba(255,255,255,.35)"/>
        ${spark(57,14,6)}${spark(13,50,4)}${spark(60,52,3)}`; }
    function cup(m,uid,sc){ const[l,d]=METALS[m]; sc=sc||1; const cx=36;
      return `<g transform="translate(0,-7)"><defs>${grad(uid,m)}</defs>
        <rect x="${cx-9*sc}" y="74" width="${18*sc}" height="8" rx="2" fill="url(#${uid})" stroke="${d}" stroke-width="1"/>
        <rect x="${cx-3}" y="58" width="6" height="18" fill="url(#${uid})"/>
        <path d="M${cx-17*sc} 26 Q${cx-19*sc} 52 ${cx} 58 Q${cx+19*sc} 52 ${cx+17*sc} 26 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.2"/>
        <ellipse cx="${cx}" cy="26" rx="${17*sc}" ry="4" fill="${l}" stroke="${d}" stroke-width="1"/>
        <path d="M${cx-17*sc} 30 q-11 1 -9 13 q2 7 10 5" fill="none" stroke="${d}" stroke-width="2.4"/>
        <path d="M${cx+17*sc} 30 q11 1 9 13 q-2 7 -10 5" fill="none" stroke="${d}" stroke-width="2.4"/>
        <path d="${star(cx,44,8)}" fill="rgba(255,255,255,.42)"/></g>`; }
    function grand(uid){ const[l,d]=METALS.gold; const cx=36;
      return `<g transform="translate(6.5,5.5) scale(.82)"><defs>${grad(uid,'gold')}</defs>
        <path d="M14 62 Q2 44 14 26" fill="none" stroke="#9db05f" stroke-width="3" stroke-linecap="round"/>
        <path d="M58 62 Q70 44 58 26" fill="none" stroke="#9db05f" stroke-width="3" stroke-linecap="round"/>
        <path d="M8 34 l-5 -3 M6 43 l-6 -1 M8 52 l-6 2 M64 34 l5 -3 M66 43 l6 -1 M64 52 l6 2" stroke="#9db05f" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="${cx-11}" y="76" width="22" height="8" rx="2" fill="url(#${uid})" stroke="${d}" stroke-width="1"/>
        <rect x="${cx-3.5}" y="58" width="7" height="18" fill="url(#${uid})"/>
        <path d="M${cx-19} 24 Q${cx-21} 52 ${cx} 58 Q${cx+21} 52 ${cx+19} 24 Z" fill="url(#${uid})" stroke="${d}" stroke-width="1.4"/>
        <ellipse cx="${cx}" cy="24" rx="19" ry="4.5" fill="${l}" stroke="${d}" stroke-width="1"/>
        <path d="${star(cx,10,9)}" fill="${l}" stroke="${d}" stroke-width="0.8"/>
        <path d="${star(cx,42,9)}" fill="rgba(255,255,255,.48)"/></g>${spark(10,14,4)}${spark(63,18,3)}`; }
    function prizeSVG(level){
      const uid="pz"+(uidc++); let inner;
      if(level<=0) return `<svg viewBox="0 0 72 96"><circle cx="36" cy="52" r="20" fill="none" stroke="#3a3f4c" stroke-width="2" stroke-dasharray="4 4"/><path d="M30 48 a6 6 0 1 1 8 5 v3" fill="none" stroke="#4a4f5c" stroke-width="2.4" stroke-linecap="round"/><circle cx="36" cy="62" r="1.6" fill="#4a4f5c"/></svg>`;
      if(level===1) inner=figStar('wood',uid);
      else if(level===2) inner=figFlame('bronze',uid);
      else if(level===3) inner=figBolt('silver',uid);
      else if(level===4) inner=figStar('gold',uid)+spark(58,12,5)+spark(12,22,3);
      else if(level===5) inner=cup('bronze',uid,0.9);
      else if(level===6) inner=cup('silver',uid,0.95);
      else if(level===7) inner=cup('gold',uid,1)+spark(60,14,4);
      else if(level===8) inner=figCrown('platinum',uid);
      else if(level===9) inner=figGem('crystal',uid);
      else inner=grand(uid);
      return `<svg viewBox="0 0 72 96">${inner}${pedestal(uid,PRIZE_WORD[level])}</svg>`;
    }

    // ---------- Праздник на весь экран: фейерверк + серпантин ----------
    let fxRaf=null;
    function closeFx(){ if(fxRaf) cancelAnimationFrame(fxRaf); fxRaf=null; const el=document.getElementById("fx"); if(el) el.remove(); }
    function celebrate(o){
      closeFx();
      const el=document.createElement("div"); el.id="fx";
      el.innerHTML=`<div class="fx-card">
          <div class="fx-prize">${prizeSVG(o.level)}</div>
          <div class="fx-k">${o.kicker}</div>
          <div class="fx-t">${o.title}</div>
          <div class="fx-s">${o.text}</div>
          <button class="fx-btn">Ура!</button>
        </div><canvas></canvas>`;
      document.body.appendChild(el);
      el.querySelector(".fx-btn").addEventListener("click",closeFx);
      try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); }catch(e){}
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
      runFx(el.querySelector("canvas"));
    }
    function runFx(cv){
      const ctx=cv.getContext("2d"); if(!ctx) return;
      const dpr=Math.min(2,window.devicePixelRatio||1);
      const W=cv.clientWidth||window.innerWidth, H=cv.clientHeight||window.innerHeight;
      cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      const COL=["#f6d370","#e3b23c","#ffffff","#cd9052","#6f9bc0","#e86a8a","#8fd3a8"];
      const R=Math.random, sparks=[], conf=[];
      const mk=first=>({ x:R()*W, y:first? -R()*H : -30, vy:1.6+R()*2.6, ph:R()*6.28, vr:(R()-.5)*.3, rot:R()*6.28,
        w:6+R()*7, h:4+R()*5, c:pick(COL), rib:R()<.3, len:8+Math.floor(R()*7) });
      for(let i=0;i<110;i++) conf.push(mk(true));
      const burst=(x,y)=>{ const c=pick(COL), c2=pick(COL);
        for(let i=0;i<70;i++){ const a=R()*6.283, v=1.4+R()*5.6;
          sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.009+R()*.012,c:R()<.7?c:c2}); } };
      const t0=performance.now(); let last=t0, lastBurst=-1e9;
      const DUR=7500;
      function loop(now){
        if(!document.body.contains(cv)){ fxRaf=null; return; }
        const dt=Math.min(2.5,(now-last)/16.7); last=now; const el=now-t0;
        ctx.clearRect(0,0,W,H);
        if(el<DUR && now-lastBurst>520){ burst(W*(.12+R()*.76), H*(.1+R()*.42)); lastBurst=now; }
        for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i];
          p.vx*=.985; p.vy=p.vy*.985+.07*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.dec*dt;
          if(p.life<=0){ sparks.splice(i,1); continue; }
          ctx.globalAlpha=p.life; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,2.3,0,6.283); ctx.fill(); }
        ctx.globalAlpha=1;
        for(let i=conf.length-1;i>=0;i--){ const p=conf[i];
          p.y+=p.vy*dt; p.ph+=.07*dt; p.x+=Math.sin(p.ph)*1.3*dt; p.rot+=p.vr*dt;
          if(p.y>H+90){ if(el<DUR) conf[i]=mk(false); else conf.splice(i,1); continue; }
          if(p.rib){ ctx.strokeStyle=p.c; ctx.lineWidth=3; ctx.lineCap="round"; ctx.beginPath();
            for(let k=0;k<p.len;k++){ const xx=p.x+Math.sin(p.ph*2+k*.7)*7, yy=p.y-k*5; if(k) ctx.lineTo(xx,yy); else ctx.moveTo(xx,yy); }
            ctx.stroke(); }
          else{ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.scale(1,Math.cos(p.ph*2)); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); } }
        if(el>=DUR && !sparks.length && !conf.length){ fxRaf=null; return; }
        fxRaf=requestAnimationFrame(loop);
      }
      fxRaf=requestAnimationFrame(loop);
    }

    // ---------- Рендер ----------
    function render(){
      ensureWeek();
      const pen=applyPenalties();
      const app=document.getElementById("app");
      const pts=state.week.points, lv=prizeLevel(pts);
      const base = lv>0?THRESH[lv-1]:0;
      const next = lv<10?THRESH[lv]:null;
      const fill = next? Math.max(4,Math.round((pts-base)/(next-base)*100)) : 100;
      const barLabel = next? `ещё ${next-pts} до «${PRIZE_NAME[lv+1]}»` : "Максимальный уровень достигнут";
      const planFixed = !!state.week.plan;
      const plan = planFixed ? state.week.plan : suggestedPlan();
      const planFill = Math.min(100, Math.round(pts/plan*100));
      const sc = shortCount();
      const planBlock = planFixed ? `
          <div class="plan-bar"><div class="plan-fill" style="width:${planFill}%"></div></div>
          <div class="plan-line"><span>${pts>=plan ? "План недели закрыт ✓" : `до плана недели ещё ${plan-pts} ${plural(plan-pts,["очко","очка","очков"])}`}</span><button class="plan-reset" id="plan-reset">сбросить план</button></div>`
        : `
          <div class="plan-box">
            <div class="pb-txt"><b>План недели не зафиксирован</b>
              <span>${sc>0 ? `Краткосрочных на неделю: ${sc} ${plural(sc,["цель","цели","целей"])} + 5 сверху = план ${plan} ${plural(plan,["очко","очка","очков"])}. После фиксации он не меняется, даже если добавишь новые цели.` : "Сначала добавь краткосрочные цели на неделю, потом зафиксируй план."}</span></div>
            ${sc>0 ? `<button class="plan-set" id="plan-set">Зафиксировать</button>` : ""}
          </div>`;

      const reward = justAwarded ? `
        <div class="reward">
          <div class="prize-badge">${prizeSVG(justAwarded.level)}</div>
          <div class="reward-txt">
            <div class="r1">Награда прошлой недели</div>
            <div class="r2">${PRIZE_NAME[justAwarded.level]}</div>
            <div class="r3">${justAwarded.points} очков · новая неделя началась</div>
            ${justAwarded.praiseText?`<div class="r-praise">${justAwarded.praiseText}</div>`:""}
          </div>
          <button class="close" id="rew-close">ОК</button>
        </div>` : "";

      app.innerHTML = `
        <header class="brand">
          <img class="logo" src="${LOGO}" alt="ODA RICHEZZA"/>
          <div class="brand-name">ЦЕЛЕВИК</div>
        </header>
        ${reward}
        <div class="week">
          <div class="week-top">
            <div class="prize-badge">${prizeSVG(lv)}</div>
            <div class="week-info">
              <div class="wp-num">${pts}<span>очков за неделю · осталось ${daysLeft()} дн.</span></div>
              <div class="prize-name">${PRIZE_NAME[lv]}</div>
              <div class="week-days">${planFixed ? `План недели: ${plan} ${plural(plan,["очко","очка","очков"])} · зафиксирован · ${planFill}%` : "План недели пока не зафиксирован"}</div>
            </div>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${fill}%"></div></div>
          <div class="bar-label">${barLabel}</div>
          ${planBlock}
          <div class="wp-break">
            <div><b style="color:var(--long)">${state.week.by.long}</b><small>долго ×15</small></div>
            <div><b style="color:var(--medium)">${state.week.by.medium}</b><small>средне ×5</small></div>
            <div><b style="color:var(--short)">${state.week.by.short}</b><small>кратко ×1</small></div>
            <div><b style="color:var(--house)">${state.week.by.household||0}</b><small>быт ×1</small></div>
          </div>
        </div>
        <div id="sections"></div>
        <div class="expenses" id="expenses"></div>
        <div class="shelf">
          <h3>Полка трофеев</h3>
          <div id="shelf-row"></div>
        </div>`;

      if(justAwarded){
        document.getElementById("rew-close").addEventListener("click",()=>{ justAwarded=null; render(); });
        if(!justAwarded.fx){ justAwarded.fx=true; const j=justAwarded;
          setTimeout(()=>celebrate({level:j.level,kicker:"Итог прошлой недели",title:PRIZE_NAME[j.level],text:j.praiseText}),350); }
      }
      const setB=document.getElementById("plan-set");
      if(setB) setB.addEventListener("click",()=>{ state.week.plan=suggestedPlan(); save(); haptic(); render(); toast(`План зафиксирован: ${state.week.plan} ${plural(state.week.plan,["очко","очка","очков"])}`, "#6f9bc0", true); });
      const resB=document.getElementById("plan-reset");
      if(resB) resB.addEventListener("click",()=>ask("Сбросить план недели? Его можно будет зафиксировать заново.",()=>{ delete state.week.plan; save(); render(); }));

      const cont=document.getElementById("sections");
      state.order.forEach(id=>cont.appendChild(sectionEl(id)));

      const shelf=document.getElementById("shelf-row");
      const tr=state.trophies||[];
      if(tr.length===0){ shelf.className=""; shelf.innerHTML=`<div class="shelf-empty">Пока пусто. Первая награда приедет в конце недели — набирай очки.</div>`; }
      else{
        shelf.className="shelf-row";
        shelf.innerHTML=tr.map(t=>`<div class="trophy"><div class="prize-badge">${prizeSVG(t.level)}</div><div class="tl">${PRIZE_NAME[t.level]}</div><div class="tp">${t.points} оч.</div></div>`).join("");
      }
      if(pen){ setTimeout(()=>toast(`−${pen.lost} очков: просрочено ${pen.hit} ${pen.hit===1?"дедлайн":"дедлайна(ов)"}`, "#e05a4a", true), 250); }
      renderExpenses(document.getElementById("expenses"));
    }

    function sectionEl(id){
      const sec=state.sections[id], m=META[id];
      const open=!state.collapsed[id];
      const cnt=sec.tasks.length;
      let hasOver=false, hasSoon=false;
      sec.tasks.forEach(t=>{ const st=dueState(t); if(st==="over") hasOver=true; else if(st==="soon") hasSoon=true; });
      const urg = hasOver?`<span class="urg over" title="есть просроченные"></span>`
                : hasSoon?`<span class="urg soon" title="есть срочные"></span>` : "";
      const el=document.createElement("div");
      el.className="section "+m.cls; el.dataset.id=id;
      el.innerHTML=`
        <div class="sec-head" data-toggle>
          <span class="tag"></span>
          <span class="sec-name">${m.title}</span>
          ${urg}
          <span class="weight-chip">×${WEIGHT[id]} за цель</span>
          <span class="chev ${open?'open':''}">▶</span>
        </div>
        <div class="sec-sub">${m.note} · открытых целей: ${cnt}</div>
        <div class="sec-body" style="${open?'':'display:none'}">
          <div class="tasks"></div>
          <div class="add-row"><button class="add-btn" data-add>+ Добавить цель</button></div>
          <div class="add-form">
            <input type="text" class="add-text" placeholder="Что хочешь добавить?" maxlength="120"/>
            <span class="due-lbl">срок:</span><input type="date" class="add-due" title="дедлайн (необязательно)"/>
            <button class="save-btn">ОК</button>
          </div>
        </div>`;
      el.querySelector("[data-toggle]").addEventListener("click",()=>{ state.collapsed[id]=!state.collapsed[id]; save(); render(); });
      const tasksEl=el.querySelector(".tasks");
      if(cnt===0){ tasksEl.innerHTML=`<div class="empty">Пусто. Добавь цель — закроешь, получишь очки.</div>`; }
      else{ sec.tasks.forEach(t=>tasksEl.appendChild(taskEl(id,t))); }
      const addBtn=el.querySelector("[data-add]"), form=el.querySelector(".add-form"),
            input=el.querySelector(".add-text"), dueIn=el.querySelector(".add-due"), okBtn=el.querySelector(".save-btn");
      addBtn.addEventListener("click",()=>{ form.classList.add("open"); addBtn.parentElement.style.display="none"; input.focus(); });
      const submit=()=>{ const text=input.value.trim(); if(!text){input.focus();return;}
        const task={id:"u"+Date.now(),text};
        if(dueIn.value){ task.due=new Date(dueIn.value+"T23:59:59").getTime(); }
        sec.tasks.push(task); save(); render(); };
      okBtn.addEventListener("click",submit);
      input.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
      return el;
    }

    function taskEl(id,t){
      const row=document.createElement("div"); row.className="task";
      const st=dueState(t);
      let right;
      if(st==="none"){ right=`<button class="due-btn add-due-btn">+ срок</button>`; }
      else{ const cls=st==="over"?"over":st==="soon"?"soon":"later"; const lbl=st==="over"?"просрочено":"до "+fmtDue(t.due);
        right=`<button class="due-btn ${cls}">${lbl}</button>`; }
      row.innerHTML=`<div class="check" role="button" aria-label="Выполнено"></div><div class="task-text">${escapeHtml(t.text)}</div>${right}<input type="date" class="due-edit"/>`;
      row.querySelector(".check").addEventListener("click",()=>complete(id,t.id,row));
      const btn=row.querySelector(".due-btn"), di=row.querySelector(".due-edit");
      if(t.due){ const d=new Date(t.due); di.value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
      btn.addEventListener("click",()=>{ try{ di.showPicker(); }catch(e){ di.click(); } });
      di.addEventListener("change",()=>{ const task=state.sections[id].tasks.find(x=>x.id===t.id); if(!task) return;
        if(di.value){ task.due=new Date(di.value+"T23:59:59").getTime(); task.penalized=false; } else { delete task.due; }
        save(); render(); });
      const textEl=row.querySelector(".task-text");
      textEl.style.cursor="text";
      textEl.addEventListener("click",()=>{
        const cur=state.sections[id].tasks.find(x=>x.id===t.id); if(!cur) return;
        row.innerHTML=`<input class="edit-in" type="text" maxlength="120" value="${escapeHtml(cur.text)}"/><button class="edit-ok">ОК</button><button class="edit-del">✕</button>`;
        const inp=row.querySelector(".edit-in"), ok=row.querySelector(".edit-ok"), del=row.querySelector(".edit-del");
        inp.focus(); try{ inp.setSelectionRange(0,inp.value.length); }catch(e){}
        const commit=()=>{ const v=inp.value.trim(); if(v){ cur.text=v; save(); } render(); };
        ok.addEventListener("click",commit);
        inp.addEventListener("keydown",e=>{ if(e.key==="Enter") commit(); if(e.key==="Escape") render(); });
        del.addEventListener("click",()=>{ state.sections[id].tasks=state.sections[id].tasks.filter(x=>x.id!==t.id); save(); render(); });
      });
      return row;
    }

    function complete(id,taskId,row){
      ensureWeek();
      const sec=state.sections[id], m=META[id];
      const before=prizeLevel(state.week.points);
      const prevPts=state.week.points;
      sec.tasks=sec.tasks.filter(x=>x.id!==taskId);
      state.week.points += WEIGHT[id];
      state.week.by[id] += 1;
      const after=prizeLevel(state.week.points);
      save(); haptic();
      row.classList.add("done");
      const planV=state.week.plan||0;
      const planNow = planV>0 && prevPts<planV && state.week.points>=planV;
      if(after>before){
        setTimeout(()=>celebrate({level:after,kicker:"Новая награда",title:PRIZE_NAME[after],text:speech(after)+(planNow?" И план недели закрыт!":"")}),420);
      } else if(planNow){
        setTimeout(()=>celebrate({level:after,kicker:"План недели закрыт",title:"План выполнен!",text:planSpeech()}),420);
      } else { toast(`+${WEIGHT[id]} ${plural(WEIGHT[id],["очко","очка","очков"])}`, m.accent, false); }
      setTimeout(render,360);
    }
    function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

    function fmtMoney(n){ return (n||0).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₽"; }
    function fmtDateStr(s){ if(!s) return ""; const p=(""+s).split("-"); return p.length===3? p[2]+"."+p[1] : s; }
    function catSum(arr){ return arr.reduce((a,e)=>a+(e.amount||0),0); }
    function renderExpenses(box){
      if(!box) return;
      const ex=state.expenses||[];
      const t=new Date();
      const today=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);
      const mp=today.slice(0,7);
      const todaySum=ex.filter(e=>e.date===today).reduce((a,e)=>a+(e.amount||0),0);
      const monthEx=ex.filter(e=>(""+(e.date||"")).slice(0,7)===mp);
      const monthSum=monthEx.reduce((a,e)=>a+(e.amount||0),0);
      const byCat={}; monthEx.forEach(e=>{ const c=e.cat||"Прочее"; (byCat[c]=byCat[c]||[]).push(e); });
      const cats=Object.keys(byCat).sort((a,b)=>catSum(byCat[b])-catSum(byCat[a]));

      const catsHtml = cats.length ? cats.map(c=>{
        const open=!!expandedCats[c];
        const rows=byCat[c].slice().sort((a,b)=>(""+b.date).localeCompare(""+a.date)).map(e=>`
          <div class="exp-row2" data-eid="${e.id}"><span class="d">${fmtDateStr(e.date)}</span><span class="it">${escapeHtml(e.item)}</span><span class="am">${fmtMoney(e.amount)}</span><button class="mv" aria-label="Изменить категорию">✎</button><button class="del" aria-label="Удалить">✕</button></div>`).join("");
        return `<div class="cat-block">
          <div class="cat-head" data-cat="${escapeHtml(c)}">
            <span class="cchev ${open?'open':''}">▶</span>
            <span class="cn">${escapeHtml(c)}</span>
            <span class="cs">${fmtMoney(catSum(byCat[c]))}</span>
          </div>
          <div class="cat-body" style="${open?'':'display:none'}">${rows}</div>
        </div>`;
      }).join("") : `<div class="shelf-empty">В этом месяце расходов пока нет.</div>`;

      box.innerHTML=`
        <h3>Оптимизация расходов</h3>
        <div class="exp-metrics">
          <div class="today"><small>Сегодня</small><b>${fmtMoney(todaySum)}</b></div>
          <div class="month"><small>За месяц</small><b>${fmtMoney(monthSum)}</b></div>
        </div>
        <div class="exp-form">
          <input type="date" class="e-date" value="${today}">
          <input type="text" class="e-item" placeholder="Статья (на что)" maxlength="60">
          <input type="number" class="e-amt" placeholder="Сумма ₽" inputmode="decimal" min="0">
          <input type="text" class="e-cat" placeholder="Категория" list="cat-list" maxlength="30">
          <datalist id="cat-list">${CATS.map(c=>`<option value="${c}">`).join("")}</datalist>
          <button class="e-add">Добавить расход</button>
        </div>
        <div class="exp-cat-title">По категориям за месяц · нажми, чтобы развернуть</div>
        <div class="exp-cats-list">${catsHtml}</div>`;

      const dEl=box.querySelector(".e-date"), iEl=box.querySelector(".e-item"), aEl=box.querySelector(".e-amt"), cEl=box.querySelector(".e-cat"), addB=box.querySelector(".e-add");
      const add=()=>{ const amt=parseFloat((aEl.value||"").replace(",",".")); const item=iEl.value.trim();
        if(!item){ iEl.focus(); return; } if(!(amt>0)){ aEl.focus(); return; }
        state.expenses.push({id:"e"+Date.now(), date:dEl.value||today, item, amount:Math.round(amt*100)/100, cat:cEl.value.trim()||"Прочее"});
        save(); render(); };
      addB.addEventListener("click",add);
      cEl.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
      box.querySelectorAll(".cat-head").forEach(h=>h.addEventListener("click",()=>{ const c=h.dataset.cat; expandedCats[c]=!expandedCats[c]; render(); }));
      box.querySelectorAll(".exp-row2 .mv").forEach(b=>b.addEventListener("click",()=>{
        const row=b.closest(".exp-row2"), exp=state.expenses.find(x=>x.id===row.dataset.eid); if(!exp) return;
        const curCat=exp.cat||"Прочее";
        const all=CATS.slice(); state.expenses.forEach(x=>{ const c=x.cat||"Прочее"; if(all.indexOf(c)===-1) all.push(c); });
        if(all.indexOf("Прочее")===-1) all.push("Прочее");
        row.innerHTML=`<span class="it">${escapeHtml(exp.item)} · ${fmtMoney(exp.amount)}</span>
          <select class="mv-sel">${all.map(c=>`<option value="${escapeHtml(c)}"${c===curCat?" selected":""}>${escapeHtml(c)}</option>`).join("")}</select>
          <button class="mv-ok">ОК</button>`;
        const sel=row.querySelector(".mv-sel");
        row.querySelector(".mv-ok").addEventListener("click",()=>{
          const nc=sel.value;
          if(nc!==curCat){ exp.cat=nc; expandedCats[nc]=true; save(); render(); toast(`Перенесено в «${nc}»`, "#6f9bc0", false); }
          else render();
        });
      }));
      box.querySelectorAll(".exp-row2 .del").forEach(b=>b.addEventListener("click",()=>{ const id=b.closest(".exp-row2").dataset.eid;
        state.expenses=state.expenses.filter(x=>x.id!==id); save(); render(); }));
    }

    let toastTimer=null;
    function toast(text,color,big){
      let t=document.getElementById("toast");
      if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
      t.innerHTML = `<span class="tdot" style="background:${color}"></span><span>${text}</span>`;
      void t.offsetWidth; t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove("show"), big?2600:1700);
    }

    function showStub(){
      document.getElementById("app").innerHTML=`<div class="stub"><h2>Не удалось загрузить данные</h2>
        <p>Файл data.json не открылся, а сохранённых целей ещё нет. Проверь, что data.json лежит рядом с приложением, и обнови страницу.</p></div>`;
    }

    (async function init(){
      const saved=load();
      if(saved && saved.version===1){ state=saved;
        if(!state.collapsed) state.collapsed={long:false,medium:false,short:false,household:false};
        if(!state.trophies) state.trophies=[];
        if(!state.sections.household){ state.sections.household={tasks:[]}; }
        if(state.order.indexOf("household")===-1) state.order.push("household");
        if(state.collapsed.household===undefined) state.collapsed.household=false;
        if(state.week && state.week.by && state.week.by.household===undefined) state.week.by.household=0;
        if(!state.expenses) state.expenses=[];
        save(); render(); return; }
      try{
        const res=await fetch("data.json?v="+Date.now(),{cache:"no-store"});
        if(!res.ok) throw new Error("bad");
        const json=await res.json();
        state=seedFrom(json); save(); render();
      }catch(e){
        try{ state=seedFrom(DEFAULT_DATA); save(); render(); }
        catch(e2){ showStub(); }
      }
    })();
  </script>
</body>
</html>
